name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On Windows runners stdout defaults to the local ANSI code page (cp1252), while many project
# scripts and error messages print non-ASCII text; a print of such a message raises
# UnicodeEncodeError on the runner, so 15 script tests went red in CI while passing locally.
#
# `tests/test_subprocess_encoding.py` already requires subprocesses started by Peach to pin
# their output with PYTHONIOENCODING=utf-8. CI lacked the same layer: that test covers how the
# source calls subprocess, not the runner's own stdout.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  workflow-lint:
    name: Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/actionlint

  plan:
    needs: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
      wide: ${{ steps.plan.outputs.wide }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      frontend: ${{ steps.plan.outputs.frontend }}
      vendor: ${{ steps.plan.outputs.vendor }}
      wheel: ${{ steps.plan.outputs.wheel }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the verification matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: uv run --locked --python 3.14 scripts/ci_plan.py --event "$EVENT_NAME" --base "$BASE_SHA"

  frontend-ready:
    name: Frontend check result
    needs: [plan, web-bundle, web-vendor]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: All selected frontend checks succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/ci_plan.py --verify-results --phase frontend

  wheel-build:
    needs: [plan, frontend-ready]
    if: ${{ !cancelled() && needs.frontend-ready.result == 'success' && needs.plan.outputs.wheel == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv build --wheel --out-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-smoke
          if-no-files-found: error
          retention-days: 7
          path: |
            wheelhouse/*.whl
            scripts/smoke_wheel.py
  wheel-smoke:
    name: Minimal wheel install / ${{ matrix.os }} / ${{ matrix.python }}
    needs: [plan, wheel-build]
    if: ${{ !cancelled() && needs.wheel-build.result == 'success' && needs.plan.outputs.wheel == 'true' }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.wheel_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-smoke
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the release wheel
        shell: bash
        run: |
          python -m pip install --no-cache-dir wheelhouse/*.whl
          python -m pip check
      - name: Smoke test outside the source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.scope }} / ${{ matrix.shard_index }}
    needs: [plan, frontend-ready]
    if: ${{ !cancelled() && needs.frontend-ready.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # tsc, lint, vitest and the browser smoke in the `web` and `packaging` scopes fail in CI when a
      # prerequisite is missing (`tests/support/conditions.py`). `core` has none of them; every other scope needs the full setup.
      - uses: actions/setup-node@v7
        if: matrix.scope != 'core'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: matrix.scope != 'core'
        run: npm --prefix frontend ci
      # Frame capture and AV1 software decoding regressions run on both platforms; Chrome for the browser smoke is set up on Windows only.
      - name: Install the pinned FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os == 'Windows' && matrix.scope != 'core'
        with:
          ffmpeg-version: "9.0.1"
          github-token: ${{ github.token }}
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS' && matrix.scope != 'core'
        run: brew install ffmpeg
      - name: Point e2e at Chrome
        if: runner.os == 'Windows' && matrix.scope != 'core'
        shell: pwsh
        run: |
          $peachChrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $peachChrome)) { throw "Chrome is not installed on the runner: $peachChrome" }
          "PEACH_E2E_CHROME=$peachChrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv locked install failed' }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'uv dependency check failed' }
      - name: Run the Windows test suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          & .\scripts\test.ps1 -Scope ${{ matrix.scope }} -Fresh -Base $env:BASE_SHA -ShardIndex ${{ matrix.shard_index }} -ShardCount ${{ matrix.shard_count }} *>&1 | Tee-Object -FilePath build/ci-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Python shard failed; see ci-tests.log' }
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
      - name: Run the macOS test suite
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build
          ./scripts/test.sh ${{ matrix.scope }} --fresh --base "$BASE_SHA" --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }} 2>&1 | tee build/ci-tests.log
      - name: Save shard test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.os }}-${{ matrix.scope }}-${{ matrix.shard_index }}
          path: build/ci-tests.log
          if-no-files-found: ignore
          retention-days: 14

  web-bundle:
    name: Island bundles and frontend tests
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - name: Frontend copy
        run: npm --prefix frontend run check:copy
      - name: Frontend lint and scan coverage
        run: |
          npm --prefix frontend run lint --silent -- --format=json > frontend-lint.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const report = JSON.parse(readFileSync("frontend-lint.json", "utf8")); assert.deepEqual(report.diagnostics, []); assert.ok(report.number_of_files > 0, "lint must scan files");'
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      # The bundles are committed to Git because neither the runtime nor packaging has Node (ADR-0022).
      # If the source changes but nobody rebuilds and commits, the server keeps serving the old island;
      # local tests cannot see that, only this comparison catches it.
      #
      # `git add -N` first: plain `git diff` only looks at tracked files, and a newly built bundle (an island
      # that starts shipping its own CSS adds a peach-ui.css) is untracked, so the gate would let it through.
      - name: Check web/dist matches the source
        run: |
          git add --intent-to-add -- web/dist
          git diff --exit-code --stat -- web/dist
      - name: npm audit (frontend)
        run: python scripts/npm_audit.py --prefix frontend

  # Each shard has its own server and demo library; browser interactions within a file stay serial.
  web-e2e:
    name: Browser regression / ${{ matrix.index }}
    needs: [plan, frontend-ready]
    if: ${{ !cancelled() && needs.frontend-ready.result == 'success' && needs.plan.outputs.browser == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    env:
      BROWSER_FILES: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install the pinned FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: "9.0.1"
          github-token: ${{ github.token }}
      - name: Point e2e at Chrome
        shell: pwsh
        run: |
          $peachChrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $peachChrome)) { throw "Chrome is not installed on the runner: $peachChrome" }
          "PEACH_E2E_CHROME=$peachChrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Python dependencies
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv locked install failed' }
      - name: Run this shard's browser tests
        shell: pwsh
        run: |
          $peachBrowserFiles = @($env:BROWSER_FILES | ConvertFrom-Json)
          & .\scripts\test.ps1 -Scope web -Focus $peachBrowserFiles
          if ($LASTEXITCODE -ne 0) { throw 'Browser shard failed' }
      - name: Save browser test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.index }}
          path: |
            build/agent-verification/browser/*.tap
            build/agent-verification/browser/serve.log
            build/agent-verification/browser/setup-serve.log
            build/agent-verification/browser/network/*.json
          if-no-files-found: ignore
          retention-days: 14

  web-vendor:
    name: Pinned frontend dependencies
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.vendor == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - name: npm audit
        run: python scripts/npm_audit.py

  verified:
    name: Full verification result
    if: always()
    needs: [plan, workflow-lint, frontend-ready, python, wheel-build, wheel-smoke, web-bundle, web-e2e, web-vendor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/ci_plan.py --verify-results
