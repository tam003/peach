name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PEACH_SENTRY_DSN: ${{ vars.PEACH_SENTRY_DSN }}
  PEACH_LIBRARY_SENTRY_DSN: ${{ vars.PEACH_LIBRARY_SENTRY_DSN }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  validate:
    name: Verify the release commit and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify mainline CI for the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_tag.py --repo "$GITHUB_REPOSITORY" --verify-sha "$GITHUB_SHA"
          python -c 'import os; from pathlib import Path; from scripts.version_bump import read_version; assert os.environ["GITHUB_REF_NAME"] == "v" + read_version(Path.cwd()), "Tag does not match the version"'
          python scripts/changelog.py --notes "${GITHUB_REF_NAME#v}" --to "$RUNNER_TEMP/release-notes.md"

  ffmpeg:
    name: Windows FFmpeg and matching source
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Reuse media tools built from pinned source, with the source bundle
        id: media-cache
        uses: actions/cache@v6.1.0
        with:
          key: windows-media-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_windows.sh', 'scripts/dav1d-mingw64.ini', 'scripts/build_untrunc_windows.sh', 'scripts/fetch_ffmpeg_sources.py', 'scripts/fetch_untrunc_sources.py', 'scripts/ffmpeg-sources.json', 'scripts/untrunc-sources.json') }}
          path: |
            build/ffmpeg-windows/ffmpeg
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
            build/untrunc-windows/untrunc
            build/untrunc-windows/untrunc-corresponding-source.zip
      - name: Install cross-compilation tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm pkg-config python3 clang meson ninja-build ca-certificates curl xz-utils
      - name: Build the pinned media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg_windows.sh build/ffmpeg-windows
      - name: Build the pinned index repair tool
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_untrunc_windows.sh build/untrunc-windows
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            build/ffmpeg-windows/ffmpeg/
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: untrunc-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            build/untrunc-windows/untrunc/
            build/untrunc-windows/untrunc-corresponding-source.zip

  windows:
    name: Windows x64 standalone beta package
    runs-on: windows-latest
    needs: ffmpeg
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify the release version
        id: version
        shell: pwsh
        run: |
          $ReleaseVersion = (Select-String -Path src/peach/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          if (-not $ReleaseVersion) { throw 'Cannot read the version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v${ReleaseVersion}") { throw 'Tag does not match the version' }
          "version=${ReleaseVersion}" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create the build environment
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv dependency install failed' }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'uv dependency check failed' }
      - name: Fetch and verify the cloudflared sidecar
        shell: pwsh
        run: '& ./scripts/fetch_cloudflared.ps1 -OutputPath "$env:RUNNER_TEMP/cloudflared.exe"'
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg-build
      - uses: actions/download-artifact@v8
        with:
          name: untrunc-windows
          path: ${{ runner.temp }}/untrunc-build
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Verify install folder choice and protection
        shell: pwsh
        run: '& ./scripts/test.ps1 -Scope packaging -Focus test_desktop_installer'
      - name: Build the standalone folder package and installer
        shell: pwsh
        run: '& ./scripts/build_windows.ps1 -Installer -CloudflaredPath "$env:RUNNER_TEMP/cloudflared.exe" -FFmpegPath "$env:RUNNER_TEMP/ffmpeg-build/ffmpeg" -UntruncPath "$env:RUNNER_TEMP/untrunc-build/untrunc"'
      - name: Produce the full package, app update package and tool packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          & ./.venv/Scripts/python.exe scripts/package_windows_release.py --source dist/Peach --output release --version '${{ steps.version.outputs.version }}' --lite-installer
          if ($LASTEXITCODE -ne 0) { throw 'Splitting the release packages failed' }
          Copy-Item 'dist/Peach-${{ steps.version.outputs.version }}-windows-x64-setup.exe' release/
          Copy-Item dist/ffmpeg-corresponding-source.zip release/
          Copy-Item dist/untrunc-corresponding-source.zip release/
          Copy-Item scripts/smoke_desktop.py release/smoke_desktop.py
          Copy-Item scripts/smoke_update_tasks.py release/smoke_update_tasks.py
          Copy-Item scripts/smoke_split_update.py release/smoke_split_update.py
          python scripts/changelog.py --notes '${{ steps.version.outputs.version }}' --to release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'CHANGELOG.md has no section for this version; a release without notes is not published' }
          Add-Content -LiteralPath release/RELEASE_NOTES.md -Value (Get-Content -Raw -Encoding utf8 release/DOWNLOADS.md) -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 7

  desktop-smoke:
    name: Acceptance from downloaded artifacts only
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-candidate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify first-run setup and the app outside the source tree
        shell: pwsh
        run: |
          Expand-Archive -Path 'Peach-${{ needs.windows.outputs.version }}-windows-x64.zip' -DestinationPath candidate
          python smoke_desktop.py candidate/Peach/Peach.exe
          if ($LASTEXITCODE -ne 0) { throw 'Artifact acceptance failed' }
      - name: Rebuild from the app update and tool packages and verify it runs
        shell: pwsh
        run: |
          python smoke_split_update.py --version '${{ needs.windows.outputs.version }}' --destination split-candidate --prepare-with-app
          if ($LASTEXITCODE -ne 0) { throw 'Split artifacts do not match the full package' }
          python smoke_desktop.py split-candidate/Peach/Peach.exe
          if ($LASTEXITCODE -ne 0) { throw 'Split artifacts failed the run check' }
      - name: Silently install, verify and uninstall the installer
        shell: pwsh
        run: |
          $Installed = Join-Path $env:RUNNER_TEMP 'Peach kiểm thử cài đặt\Thư mục tùy chọn'
          $Setup = Start-Process -FilePath './Peach-${{ needs.windows.outputs.version }}-windows-x64-setup.exe' `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$Installed`"" -Wait -PassThru
          if ($Setup.ExitCode -ne 0) { throw "Installer exit code $($Setup.ExitCode)" }
          $Key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{02D9748A-78F6-4866-AC75-918177194DAB}_is1'
          $Menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Peach.lnk'
          if (-not (Test-Path -LiteralPath $Key) -or -not (Test-Path -LiteralPath $Menu)) { throw 'The installer registered no uninstall entry or Start menu item' }
          python smoke_desktop.py (Join-Path $Installed 'Peach.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installer acceptance failed' }
          # The uninstaller copies itself to a temp folder and the original process returns at once, so completion is judged by the folder disappearing.
          Start-Process -FilePath (Join-Path $Installed 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $Deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $Installed) -and (Get-Date) -lt $Deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $Installed) { throw 'The program folder is still there after uninstall' }
          if ((Test-Path -LiteralPath $Key) -or (Test-Path -LiteralPath $Menu)) { throw 'Registry entries or Start menu items remain after uninstall' }
      - name: Install and verify the lite installer
        shell: pwsh
        run: |
          $Installed = Join-Path $env:RUNNER_TEMP 'Peach kiểm thử cài đặt nhẹ\Thư mục tùy chọn'
          $Setup = Start-Process -FilePath './Peach-${{ needs.windows.outputs.version }}-windows-x64-lite-setup.exe' `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$Installed`"" -WindowStyle Hidden -Wait -PassThru
          if ($Setup.ExitCode -ne 0) { throw "Lite installer exit code $($Setup.ExitCode)" }
          python smoke_desktop.py (Join-Path $Installed 'Peach.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Lite installer failed the run check' }
          Start-Process -FilePath (Join-Path $Installed 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait
          $Deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $Installed) -and (Get-Date) -lt $Deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $Installed) { throw 'The program folder is still there after uninstalling the lite installer' }
      - name: Verify in-flight task protection and recovery after an overlay install
        shell: pwsh
        run: |
          python smoke_update_tasks.py candidate/Peach/Peach.exe --installer './Peach-${{ needs.windows.outputs.version }}-windows-x64-setup.exe' --apply
          if ($LASTEXITCODE -ne 0) { throw 'Task protection and recovery check failed' }
      - name: Keep artifact acceptance failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-failure
          path: smoke-evidence/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} standalone beta package
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      ARCHFLAGS: '-arch ${{ matrix.arch }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create the native-architecture build environment
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
          npm ci --prefix frontend
      - name: Build the standalone app and drag-to-install disk image
        run: .venv/bin/python scripts/build_macos_standalone.py --target-arch '${{ matrix.arch }}' --destination release
      - uses: actions/upload-artifact@v7
        with:
          name: macos-candidate-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            scripts/smoke_macos.py
            scripts/smoke_desktop.py
            scripts/MACOS_DOWNLOADS.md

  macos-smoke:
    name: macOS ${{ matrix.arch }} acceptance from downloaded artifacts only
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-candidate-${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Mount the image and verify the app outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          image=(release/*-macos-${{ matrix.arch }}.dmg)
          test "${#image[@]}" -eq 1
          mount="$RUNNER_TEMP/Peach-install"
          mkdir -p "$mount"
          hdiutil verify "${image[0]}"
          hdiutil attach "${image[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          test "$(readlink "$mount/Applications")" = /Applications
          test -s "$mount/Peach.app/Contents/Resources/LICENSE"
          codesign --verify --deep --strict "$mount/Peach.app"
          lipo -verify_arch '${{ matrix.arch }}' "$mount/Peach.app/Contents/MacOS/Peach"
          python scripts/smoke_macos.py "$mount/Peach.app"

  release:
    name: GitHub pre-release
    if: github.ref_type == 'tag'
    needs: [windows, desktop-smoke, macos-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-candidate
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-candidate-*
          merge-multiple: true
          path: macos-candidates
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd release
          cp ../macos-candidates/release/*.dmg .
          tail -n +4 ../macos-candidates/scripts/MACOS_DOWNLOADS.md >> RELEASE_NOTES.md
          sha256sum ./*.zip ./*-setup.exe ./*.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*-setup.exe ./*.dmg SHA256SUMS.txt --verify-tag --prerelease --title "Peach $VERSION · Windows / macOS beta" --notes-file RELEASE_NOTES.md

  project-board:
    name: Sync the published version to the project board
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Request a project board sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run project-board.yml --ref master
