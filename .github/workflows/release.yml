name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PEACH_SENTRY_DSN: ${{ vars.PEACH_SENTRY_DSN }}
  PEACH_LIBRARY_SENTRY_DSN: ${{ vars.PEACH_LIBRARY_SENTRY_DSN }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  validate:
    name: Verify the release commit and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify the tagged commit is on master
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_tag.py --repo "$GITHUB_REPOSITORY" --verify-sha "$GITHUB_SHA"
          python -c 'import os; from pathlib import Path; from scripts.version_bump import read_version; assert os.environ["GITHUB_REF_NAME"] == "v" + read_version(Path.cwd()), "Tag does not match the version"'
          python scripts/changelog.py --notes "${GITHUB_REF_NAME#v}" --to "$RUNNER_TEMP/release-notes.md"

  ffmpeg:
    name: Windows FFmpeg and matching source
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Reuse media tools built from pinned source, with the source bundle
        id: media-cache
        uses: actions/cache@v6.1.0
        with:
          key: windows-media-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_windows.sh', 'scripts/dav1d-mingw64.ini', 'scripts/build_untrunc_windows.sh', 'scripts/fetch_ffmpeg_sources.py', 'scripts/fetch_untrunc_sources.py', 'scripts/ffmpeg-sources.json', 'scripts/untrunc-sources.json') }}
          path: |
            build/ffmpeg-windows/ffmpeg
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
            build/untrunc-windows/untrunc
            build/untrunc-windows/untrunc-corresponding-source.zip
      - name: Install cross-compilation tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm pkg-config python3 clang meson ninja-build ca-certificates curl xz-utils
      - name: Build the pinned media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg_windows.sh build/ffmpeg-windows
      - name: Build the pinned index repair tool
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_untrunc_windows.sh build/untrunc-windows
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            build/ffmpeg-windows/ffmpeg/
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: untrunc-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            build/untrunc-windows/untrunc/
            build/untrunc-windows/untrunc-corresponding-source.zip

  windows:
    name: Windows x64 standalone beta package
    runs-on: windows-latest
    needs: ffmpeg
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify the release version
        id: version
        shell: pwsh
        run: |
          $ReleaseVersion = (Select-String -Path src/peach/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          if (-not $ReleaseVersion) { throw 'Cannot read the version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v${ReleaseVersion}") { throw 'Tag does not match the version' }
          "version=${ReleaseVersion}" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create the build environment
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv dependency install failed' }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'uv dependency check failed' }
      - name: Fetch and verify the cloudflared sidecar
        shell: pwsh
        run: '& ./scripts/fetch_cloudflared.ps1 -OutputPath "$env:RUNNER_TEMP/cloudflared.exe"'
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg-build
      - uses: actions/download-artifact@v8
        with:
          name: untrunc-windows
          path: ${{ runner.temp }}/untrunc-build
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Build the standalone folder package and installer
        shell: pwsh
        run: '& ./scripts/build_windows.ps1 -Installer -CloudflaredPath "$env:RUNNER_TEMP/cloudflared.exe" -FFmpegPath "$env:RUNNER_TEMP/ffmpeg-build/ffmpeg" -UntruncPath "$env:RUNNER_TEMP/untrunc-build/untrunc"'
      - name: Produce the full package, app update package and tool packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          & ./.venv/Scripts/python.exe scripts/package_windows_release.py --source dist/Peach --output release --version '${{ steps.version.outputs.version }}' --lite-installer
          if ($LASTEXITCODE -ne 0) { throw 'Splitting the release packages failed' }
          Copy-Item 'dist/Peach-${{ steps.version.outputs.version }}-windows-x64-setup.exe' release/
          Copy-Item dist/ffmpeg-corresponding-source.zip release/
          Copy-Item dist/untrunc-corresponding-source.zip release/
          python scripts/changelog.py --notes '${{ steps.version.outputs.version }}' --to release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'CHANGELOG.md has no section for this version; a release without notes is not published' }
          Add-Content -LiteralPath release/RELEASE_NOTES.md -Value (Get-Content -Raw -Encoding utf8 release/DOWNLOADS.md) -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} standalone beta package
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      ARCHFLAGS: '-arch ${{ matrix.arch }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create the native-architecture build environment
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
          npm ci --prefix frontend
      - name: Build the standalone app and drag-to-install disk image
        run: .venv/bin/python scripts/build_macos_standalone.py --target-arch '${{ matrix.arch }}' --destination release
      - uses: actions/upload-artifact@v7
        with:
          name: macos-candidate-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            scripts/MACOS_DOWNLOADS.md

  release:
    name: GitHub pre-release
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-candidate
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-candidate-*
          merge-multiple: true
          path: macos-candidates
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd release
          cp ../macos-candidates/release/*.dmg .
          tail -n +4 ../macos-candidates/scripts/MACOS_DOWNLOADS.md >> RELEASE_NOTES.md
          sha256sum ./*.zip ./*-setup.exe ./*.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*-setup.exe ./*.dmg SHA256SUMS.txt --verify-tag --prerelease --title "Peach $VERSION · Windows / macOS beta" --notes-file RELEASE_NOTES.md

  project-board:
    name: Sync the published version to the project board
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Request a project board sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run project-board.yml --ref master
